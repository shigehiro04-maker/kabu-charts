<script>
const CODE = "7377";
// お気に入り銘柄（一覧ページと共有。この端末のブラウザに保存されます）
(function(){
  const el=document.getElementById("star");
  let w=new Set();
  try{ w=new Set(JSON.parse(localStorage.getItem("kabuWatch")||"[]")); }catch(e){}
  const paint=()=>el.classList.toggle("on", w.has(CODE));
  paint();
  el.addEventListener("click",()=>{
    if(w.has(CODE)) w.delete(CODE); else w.add(CODE);
    try{ localStorage.setItem("kabuWatch",JSON.stringify([...w])); }catch(e){}
    paint();

function aggregate(bs, mode){

           const mo=new Date(dt); mo.setDate(dt.getDate()-((dt.getDay()+6)%7));
           k=mo.toISOString().slice(0,10); }

}

    if(i>=w-1&&c===w)o[i]=s/w;} return o;}

function bollinger(bs, W){   // {t,mid,u1..u3,l1..l3} の配列
  const cl=bs.map(b=>b.c), n=cl.length, out=[]; let s=0,s2=0;

    if(up){ sar=Math.min(sar,l[i-1],l[i-2]);
      if(l[i]<sar){ up=false; sar=ep; ep=l[i]; af=step; } else if(h[i]>ep){ ep=h[i]; af=Math.min(af+step,mx); } }

    s[i]=sar; d[i]=up; }
  return {s,d}; }

// 価格帯別出来高：表示中の足の出来高を、その足の安値〜高値の範囲へ均等に配分して価格帯ごとに合計する

const VPCOL={va:"rgba(100,116,139,.30)", out:"rgba(100,116,139,.14)", poc:"rgba(232,163,61,.62)", pocLine:"#E8A33D"};
function volProfile(bs, lo, hi, nb){
  if(!(hi>lo)) return null;
  const w=(hi-lo)/nb, vol=new Array(nb).fill(0), up=new Array(nb).fill(0); let tot=0;
  const idx=p=>Math.min(nb-1,Math.max(0,Math.floor((p-lo)/w)));
  for(const b of bs){ if(!(b.v>0)) continue; tot+=b.v; const isUp=b.c>=b.o;
    const k0=idx(b.l), k1=idx(b.h), rng=b.h-b.l;
    for(let k=k0;k<=k1;k++){
      const share=(k0===k1||rng<=0)?1:(Math.min(b.h,lo+(k+1)*w)-Math.max(b.l,lo+k*w))/rng;
      if(share<=0) continue; vol[k]+=b.v*share; if(isUp) up[k]+=b.v*share; } }
  if(tot<=0) return null;
  let poc=0; for(let k=1;k<nb;k++) if(vol[k]>vol[poc]) poc=k;
  // バリューエリア：POCから出来高の多い側へ1段ずつ広げ、全体の70%に達するまで
  let a=poc, z=poc, s=vol[poc];
  while(s<tot*0.7 && (a>0||z<nb-1)){
    const dn=a>0?vol[a-1]:-1, upv=z<nb-1?vol[z+1]:-1;
    if(upv>=dn){ z++; s+=vol[z]; } else { a--; s+=vol[a]; } }
  return {lo, w, nb, vol, up, tot, poc, vaLo:a, vaHi:z, max:vol[poc],
          pocP:lo+(poc+0.5)*w, valP:lo+a*w, vahP:lo+(z+1)*w};
}

function line(vals,X,Y,n,color,w){
  let pts=0, started=false; ctx.beginPath();
  for(let i=0;i<n;i++){const v=vals[i]; if(v==null){started=false;continue;} pts++;
    started?ctx.lineTo(X(i),Y(v)):(ctx.moveTo(X(i),Y(v)),started=true);}
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke();
  if(pts===1){for(let i=0;i<n;i++){const v=vals[i]; if(v==null)continue;
    ctx.beginPath();ctx.arc(X(i),Y(v),2.6,0,7);ctx.fillStyle=color;ctx.fill();}}
}

function prepare(){

  const cut=(a,len)=>{const o=[]; for(let i=0;i<(len||n);i++){const v=a[S+i]; o.push(v===undefined?null:v);} return o;};
  const d={S,n,ext:0,tr:{},os:{}};
  if(on("sma")) d.tr.sma=P.mas.map(w=>cut(calc(agg,"sma"+w,f=>smaA(f.c,w))));
  if(on("ema")) d.tr.ema=EMAW.map(w=>cut(calc(agg,"ema"+w,f=>emaA(f.c,w))));
  if(on("wma")) d.tr.wma=WMAW.map(w=>cut(calc(agg,"wma"+w,f=>wmaA(f.c,w))));
  if(on("bb")){ const b=bbOn(agg,P.bbAgg,P.bb), o={}; for(const k of BBK) o[k]=cut(b[k]); d.tr.bb=o; }
  if(on("ichi")){

    // 先行スパンは当日を含めて26本先に描く（未来の雲が見えるよう右側に余白を取る）
    d.ext=n>=20?Math.min(26,Math.round(n*0.3)):0;
    d.tr.ichi={tk:cut(I.tk),kj:cut(I.kj),ck:cut(I.ck),sa:cut(I.sa,n+d.ext),sb:cut(I.sb,n+d.ext)};
  }
  if(on("psar")){ const s=calc(agg,"psar",f=>psarA(f,0.02,0.2)); d.tr.psar={s:cut(s.s),d:cut(s.d)}; }
  if(on("env")){ const m=calc(agg,"sma25",f=>smaA(f.c,25)), ps=ENVP[agg];
    d.tr.env={m:cut(m), u:ps.map(p=>cut(m).map(v=>v==null?null:v*(1+p/100))), l:ps.map(p=>cut(m).map(v=>v==null?null:v*(1-p/100))), ps}; }
  if(on("hl")){ const H=cut(calc(agg,"hh20",f=>hhA(f.h,20,1))), L=cut(calc(agg,"ll20",f=>llA(f.l,20,1)));
    d.tr.hl={H,L,M:zip(H,L,(a,b)=>(a+b)/2)}; }
  if(on("reg") && n>=5){ let sx=0,sy=0,sxx=0,sxy=0; const ys=view.map(b=>b.c);
    for(let i=0;i<n;i++){sx+=i;sy+=ys[i];sxx+=i*i;sxy+=i*ys[i];}

      ctx.font='11px system-ui,sans-serif'; ctx.textAlign="left";
      if(col){ctx.fillStyle=col; ctx.fillRect(x,y-1.2,10,2.4); x+=14;}
      ctx.fillStyle=mut; ctx.fillText(label,x,y); x+=ctx.measureText(label).width+4;
      ctx.font='600 11px system-ui,sans-serif'; ctx.fillStyle=col||fg;
      ctx.fillText(val,x,y); x+=ctx.measureText(val).width+14; } };
  const frame=(top,h)=>{ ctx.strokeStyle=gl; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L,top+.5);ctx.lineTo(L+plotW,top+.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(L,top+h-.5);ctx.lineTo(L+plotW,top+h-.5);ctx.stroke(); };

  // 価格チャートとサブチャートの境界線
  ctx.strokeStyle=gl; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(L,pB+.5);ctx.lineTo(L+plotW,pB+.5);ctx.stroke();

  let paneY=pB;
  for(const p of panes){
    const hT=paneY+g, top=hT+HD, bot=top+p.h; paneY=bot;
    if(p.k==="vol"){
      const vmax=Math.max(...view.map(b=>b.v))||1, vh=p.h-2, VA=D.os.vol.a, VY=v=>bot-v/vmax*vh*0.95;
      header(hT,[["出来高",fmtV(last.v),null],["25"+unit+"平均",VA[n-1]==null?"—":fmtV(VA[n-1]),"#6B7280"]]);
      vgrid(top,bot); frame(top,p.h);
      for(let i=0;i<n;i++){const b=view[i];
        ctx.fillStyle=(b.c>=b.o?"rgba(209,67,67,.45)":"rgba(46,125,107,.45)");
        const h=Math.max(1,b.v/vmax*vh*0.95); ctx.fillRect(X(i)-bw/2,bot-h,bw,h);}
      ctx.save();ctx.beginPath();ctx.rect(L,top,plotW,p.h);ctx.clip(); line(VA,X,VY,n,"#6B7280",1.1); ctx.restore();
      ctx.font='10px system-ui,sans-serif';ctx.fillStyle=mut;ctx.textAlign="left";ctx.textBaseline="middle";
      ctx.fillText(fmtV(vmax),L+plotW+7,top+6);
      continue;
    }
    const def=p.def, S=D.os[p.k], lines=(typeof def.lines==="function")?def.lines(P):def.lines;
    let a0,a1;
    if(def.fix){ [a0,a1]=def.fix; }
    else { a0=Infinity; a1=-Infinity;
      for(const k in S) for(const v of S[k]) if(v!=null&&isFinite(v)){ a0=Math.min(a0,v); a1=Math.max(a1,v); }
      if(def.zero){ a0=Math.min(a0,0); a1=Math.max(a1,0); }
      if(!isFinite(a0)){ a0=0; a1=1; }
      const pd=(a1-a0)*0.08||Math.abs(a1)*0.1||1; a0-=pd; a1+=pd; }
    const OY=v=>bot-2-(Math.max(a0,Math.min(a1,v))-a0)/(a1-a0)*(p.h-4);
    header(hT, lines.map(([k,lab,col])=>[lab.replace(/%u/g,unit), fmtO(S[k][n-1]), col]));
    vgrid(top,bot); frame(top,p.h);
    if(def.hot){ const [z0,z1]=[def.hot[0],def.hot[1]==null?a1:def.hot[1]]; if(z1>a0&&z0<a1){ ctx.fillStyle="rgba(209,67,67,.06)"; ctx.fillRect(L,OY(z1),plotW,OY(z0)-OY(z1)); } }
    if(def.cool){ const [z0,z1]=[def.cool[0]==null?a0:def.cool[0],def.cool[1]]; if(z1>a0&&z0<a1){ ctx.fillStyle="rgba(46,125,107,.07)"; ctx.fillRect(L,OY(z1),plotW,OY(z0)-OY(z1)); } }
    ctx.font='10px system-ui,sans-serif';ctx.textBaseline="middle";ctx.textAlign="left";
    const lbl=[];
    for(const lv of (def.lv||[])){ if(lv<=a0||lv>=a1) continue;
      const y=Math.round(OY(lv))+.5; ctx.strokeStyle=gl; ctx.lineWidth=1;
      ctx.setLineDash((lv===0||lv===50)?[1,4]:[3,3]); ctx.beginPath();
      ctx.moveTo(L,y);ctx.lineTo(L+plotW,y);ctx.stroke(); ctx.setLineDash([]);
      if(lbl.every(q=>Math.abs(q-y)>=10)){ lbl.push(y); ctx.fillStyle=mut; ctx.fillText(lv>0&&def.fix&&def.fix[0]<0?"+"+lv:fmtO(lv).replace(/\.0+$/,""),L+plotW+7,y); } }
    if(!def.fix){ for(const [v,y] of [[a1,top+6],[a0,bot-6]]) if(lbl.every(q=>Math.abs(q-y)>=11)){ ctx.fillStyle=mut; ctx.fillText(fmtO(v),L+plotW+7,y); } }
    ctx.save();ctx.beginPath();ctx.rect(L,top,plotW,p.h);ctx.clip();
    if(def.hist){ const hs=S[def.hist], y0=OY(0);
      for(let i=0;i<n;i++){ const v=hs[i]; if(v==null) continue;
        ctx.fillStyle=v>=0?"rgba(209,67,67,.40)":"rgba(46,125,107,.40)"; const y=OY(v);
        ctx.fillRect(X(i)-bw/2,Math.min(y,y0),bw,Math.max(1,Math.abs(y0-y))); } }
    for(let j=lines.length-1;j>=0;j--){ const [k,,col]=lines[j]; line(S[k],X,OY,n,col,1.4); }
    for(const [k,,col] of lines){ const v=S[k][n-1];
      if(v!=null){ctx.beginPath();ctx.arc(X(n-1),OY(v),2.4,0,7);ctx.fillStyle=col;ctx.fill();} }
    ctx.restore();
  }
  geo={L,cw,n,H,pT,pB,plotW,lo,hi,bot:paneY};

  ctx.font='11px system-ui,sans-serif';ctx.fillStyle=mut;ctx.textAlign="center";ctx.textBaseline="middle";
  let prevL=Infinity;   // 右から順に置き、前のラベルと重なるものは省く
  for(const i of ticks){const d=view[i].t;
    const s=P.agg==="m"?d.slice(0,7).replace("-","/"):d.slice(2).replace(/-/g,"/");
    const hw=ctx.measureText(s).width/2;
    const x=Math.min(L+plotW-hw, Math.max(L+hw, X(i)));
    if(x+hw+10>prevL) continue;
    ctx.fillText(s,x,H-B/2+1); prevL=x-hw;}

  document.getElementById("last").textContent=fmt(lb.c);
  const ch=pv!=null?lb.c-pv:0;
  const ce=document.getElementById("chg");
  ce.textContent=(ch>=0?"+":"")+fmt(ch)+" ("+(ch>=0?"+":"")+(pv?ch/pv*100:0).toFixed(2)+"%)";
  ce.className="chg "+(ch>=0?"up":"dn");
  document.getElementById("asof").textContent=narrow?lb.t.slice(5).replace("-","/")+" 時点・"+unit+"足":lb.t+" 時点 ／ "+unit+"足 "+n+"本表示";

  // 凡例は価格チャートに重ねた線だけ。オシレーターの値は各サブチャートの見出しに、細かい値はツールチップに
  const lg=[], it=(col,txt,val)=>'<span><i style="background:'+col+'"></i>'+txt+(val!=null?' <b>'+val+'</b>':'')+'</span>';
  if(showMA)P.mas.forEach((w,j)=>lg.push('<span><i style="background:'+MACOL[j]+'"></i>'+w+unit+'線'
     +(j===midIdx&&showBB&&!narrow?'<span style="font-size:.9em">(BB中心)</span>':'')+' <b>'+fmt(T_.sma[j][n-1])+'</b></span>'));
  if(T_.ema) EMAW.forEach((w,j)=>lg.push(it(EMACOL[j],'EMA'+w+unit,fmt(T_.ema[j][n-1]))));
  if(T_.wma) WMAW.forEach((w,j)=>lg.push(it(WMACOL[j],'WMA'+w+unit,fmt(T_.wma[j][n-1]))));
  if(showBB){
    if(drawMid) lg.push('<span><i style="background:#4A6FA5"></i>'+(narrow?'BB中心':'BB中心('+P.bb+bu+')')+' <b>'+fmt(T_.bb.mid[n-1])+'</b></span>');
    lg.push('<span><i class="bb"></i>'+(narrow?'BB'+(drawMid?'':'('+P.bb+bu+')'):'BB ±1〜3σ'+(drawMid?'':'('+P.bb+bu+')'))+'</span>');
  }
  if(T_.ichi){ const I=T_.ichi; lg.push(it(ICH.tk,'転換線',fmt(I.tk[n-1])), it(ICH.kj,'基準線',fmt(I.kj[n-1])),
      it(ICH.sa,'雲',fmt(I.sa[n-1])+'〜'+fmt(I.sb[n-1])), it(ICH.ck,'遅行スパン',null)); }
  if(T_.psar){ const v=T_.psar.s[n-1]; lg.push(it(T_.psar.d[n-1]?upCol:dnCol,'SAR'+(v==null?'':(T_.psar.d[n-1]?'(上昇)':'(下降)')),fmt(v))); }
  if(T_.env) lg.push(it("rgba(110,120,130,.85)",'エンベロープ 25'+unit+' ±'+T_.env.ps.join('・')+'%',null));
  if(T_.hl) lg.push(it("#A0522D",'HLバンド20'+unit,fmt(T_.hl.H[n-1])+' / '+fmt(T_.hl.L[n-1])));
  if(T_.reg) lg.push(it("#6B5B95",'回帰トレンド',fmt(T_.reg.fit[n-1])+'（±1σ '+fmt(T_.reg.sd)+'）'));
  if(T_.pivot&&T_.pivot.next){ const x=T_.pivot.next;
    lg.push(it("rgba(107,114,128,.8)",narrow?'次の足PIV':'ピボット(次の足)','R2 '+fmt(x.r2)+' R1 '+fmt(x.r1)+' P '+fmt(x.p)+' S1 '+fmt(x.s1)+' S2 '+fmt(x.s2))); }
  if(T_.fib) lg.push(it("#B8860B",'フィボナッチ（'+(T_.fib.upT?'上昇からの押し':'下落からの戻り')+'）',fmt(T_.fib.L)+'〜'+fmt(T_.fib.H)));
  if(VP) lg.push('<span><i style="background:'+VPCOL.pocLine+'"></i>'+(narrow?'POC':'価格帯別出来高 POC')+' <b>'+fmt(VP.pocP)+'</b>'
     +'<span style="margin-left:6px">'+(narrow?'VA':'出来高70%の帯')+' <b>'+Math.round(VP.valP).toLocaleString("ja-JP")+'〜'+Math.round(VP.vahP).toLocaleString("ja-JP")+'</b></span></span>');
  if(D.sg){ let nb=0,ns=0,li=-1; D.sg.forEach((e,i)=>{ if(!e) return; nb+=e.b.length; ns+=e.s.length; li=i; });
    let lt=""; if(li>=0){ const e=D.sg[li];
      lt=e.b.map(d=>'<b style="color:'+SGBUY+'">▲</b>'+d.bl(P)).concat(e.s.map(d=>'<b style="color:'+SGSELL+'">▼</b>'+d.sl(P))).join(" ");
      lt='<span style="margin-left:6px">直近 '+(narrow?view[li].t.slice(5).replace("-","/"):view[li].t)+' '+lt+'</span>'; }
    lg.push('<span><span class="sgb" style="background:'+SGBUY+'">買</span><b>'+nb+'</b>　<span class="sgb" style="background:'+SGSELL+'">売</span><b>'+ns+'</b>'+lt+'</span>'); }
  document.getElementById("legend").innerHTML=lg.join("");
  // 凡例の行数が変わってチャートの上端がずれたら、もう一度だけ高さを合わせ直す
  if(narrow && !_again){ const nt=cv.getBoundingClientRect().top+window.scrollY;
    if(_usedTop!=null && Math.abs(nt-_usedTop)>1){ _again=true; try{ draw(); } finally{ _again=false; } } }

  const totMA=AGG[P.agg].length;
  const lack=showMA?P.mas.filter(w=>Math.max(0,totMA-w+1)<12):[];
  const bbNote="BB"+P.bb+bu+" ±1〜3σ"+(P.bbAgg!==P.agg?"（週足で計算し"+unit+"足に重ねて表示）":"");
  const notes=[];
  for(const d of TRD) if(on(d.k)&&NOTE[d.k]) notes.push("【"+d.name+"】"+NOTE[d.k](unit,P));
  for(const d of OSC) if(onO(d.k)&&NOTE[d.k]) notes.push("【"+d.name+"】"+NOTE[d.k](unit,P));
  const sgs=SGD.filter(x=>onS(x.k));
  if(sgs.length) notes.push("【売買サイン】"+sgs.map(x=>x.desc(unit,P)).join("。")+"。"+unit+"足の終値で判定した機械的な目安で、売買を勧めるものではありません（だましも多く出ます）。");
  document.getElementById("note").textContent=
    "元データは日足です。"+
    (P.agg==="d"?"日足のまま表示し、指標は全期間の日足で計算しています（移動平均 "+P.mas.join("・")+"日、"+bbNote+"）。"
     :(unit+"足に集約し、指標も"+unit+"足ベースで計算しています（移動平均 "+P.mas.join(unit+"・")+unit+"、"+bbNote+"）。"))+
    (showMA&&showBB&&midIdx>=0?" "+P.bb+unit+"移動平均とBB中心線は同じ値のため1本で表示しています。":"")+
    (lack.length?" ※保有データは"+totMA+unit+"ぶんのため、"+lack.join("・")+unit
      +"線は右端の"+lack.map(w=>Math.max(0,totMA-w+1)).join("・")+"点しか描けません"
      +"（フルに引くにはより長期のデータ取得が必要）。":"")+
    (notes.length?" "+notes.join(" "):"")+DATANOTE;
  if(DATANOTE) document.getElementById("ntbox").open=true;
}

/* 指標ごとの説明（「指標の計算方法」に、表示中のものだけ載せる） */
const NOTE={
 ema:u=>"直近ほど重みを大きくした移動平均（"+EMAW.join("・")+u+"）。単純移動平均より転換に早く反応します。破線で表示。",
 wma:u=>"直近の足ほど係数を大きくした加重平均（"+WMAW.join("・")+u+"）。点線で表示。",
 bb:()=>"移動平均±標準偏差の帯。±2σの外は行き過ぎ（逆張り）、帯に沿った推移は強いトレンド（順張り）とされます。",
 ichi:u=>"転換線＝9"+u+"の高安の中値、基準線＝26"+u+"の中値、先行スパン1＝(転換線＋基準線)÷2、先行スパン2＝52"+u+"の中値で、どちらも当日を含め26本先に描画（右端の薄い部分が未来の雲）。遅行スパン＝終値を26本前に描画。雲の上は強気、下は弱気の目安。",
 psar:()=>"加速因子0.02（最大0.2）のパラボリックSAR。点が足の下（赤）は上昇局面、上（緑）は下降局面。足が点を抜けたところが転換の目安。",
 env:(u,P)=>"25"+u+"移動平均から上下に一定率（±"+ENVP[P.agg].join("・")+"%）離した線。移動平均からの離れ具合で行き過ぎを見ます（足の種類ごとに幅を変えています）。",
 hl:u=>"前の足から遡って20"+u+"の最高値（H）・最安値（L）とその中値。Hの上抜け／Lの下抜けはブレイクアウトの目安。",
 reg:()=>"表示中の終値に最小二乗法で引いた直線（FIT）と、そこからの残差の±1σ・±2σ。",
 pivot:()=>"前の足の高値・安値・終値から計算。P＝(高＋安＋終)÷3、R1＝2P−安、S1＝2P−高、R2＝P＋(高−安)、S2＝P−(高−安)。凡例は最新の足から求めた次の足の値。",
 fib:()=>"表示中の最高値・最安値を結び、23.6・38.2・50・61.8・76.4%の押し／戻りの水準を引いたもの。",
 vp:()=>"表示中の足の出来高を、各足の安値〜高値に均等に配分して価格帯（40段）ごとに合計したもの（日足からの近似）。POCは最も出来高が多い価格帯、濃い帯は出来高の70%が集まる価格帯（バリューエリア）。",
 vol:u=>"棒は各"+u+"足の出来高（陽線は赤、陰線は緑）、線は25本の平均。",
 macd:()=>"12と26の指数移動平均の差（MACD）と、その9本指数移動平均（シグナル）。棒はその差。MACDがシグナルや0を上抜け（下抜け）で買い（売り）の目安。",
 rsi:u=>"14"+u+"、Wilder方式。70以上は買われすぎ、30以下は売られすぎの目安。",
 rci:u=>"9"+u+"・26"+u+"の日付と価格の順位相関。+80以上は高値圏、−80以下は安値圏の目安。",
 stoch:()=>"%K＝(終値−14本の最安値)÷(14本の高安の幅)、%D＝%Kの3本平均。70以上は高値圏、30以下は安値圏。",
 sstoch:()=>"%D（%Kの3本平均）と、その3本平均の%SD。ストキャスティクスよりなめらかでダマシが少ない。",
 dmi:()=>"+DI（上昇の強さ）、−DI（下落の強さ）、ADX（トレンドの強さ）。いずれも14本のWilder平滑。+DIが−DIを上抜けで買いの目安、ADXが上昇中はトレンドが強い。",
 dev:(u,P)=>"終値が"+P.mas.slice(0,2).join(u+"・")+u+"移動平均から何%離れているか。",
 mom:u=>"終値−10"+u+"前の終値。0を上抜け（下抜け）で上昇（下落）の勢いが出た目安。",
 roc:u=>"25"+u+"前の終値からの変化率（%）。",
 psy:u=>"直近12"+u+"のうち前の足より上がった割合。75%以上は過熱、25%以下は底入れの目安。",
 wr:()=>"直近14本の高安の幅の中で、終値が高値からどれだけ下にあるか（0〜−100）。−20以上は買われすぎ、−80以下は売られすぎ。",
 cci:()=>"(高＋安＋終)÷3 の20本平均からの乖離を平均偏差で割ったもの（×1/0.015）。+100超は買われすぎ、−100未満は売られすぎの目安。",
 atr:()=>"真の値幅（当日高安・前日終値とのギャップを含む最大幅）の14本Wilder平均。値動きの大きさ（株価と同じ単位）。",
 ab:()=>"Aレシオ＝Σ(高−始)÷Σ(始−安)、Bレシオ＝Σ(高−前日終)÷Σ(前日終−安)の26本合計×100。100が均衡、高すぎは過熱・低すぎは底値圏の目安。",
 aroon:()=>"過去14本で最高値（アップ）・最安値（ダウン）をつけてからの経過本数を0〜100にしたもの。アップが高くダウンが低いと上昇トレンド。",
 uos:()=>"7・14・28本の買い圧力（終値−min(安値,前日終値)）÷真の値幅を4:2:1で加重平均。70以上は買われすぎ、30以下は売られすぎ。",
 vr:u=>"25"+u+"の(上昇した足の出来高＋変わらずの半分)÷(下落した足の出来高＋変わらずの半分)×100。450%以上は過熱、70%以下は底値圏の目安。",
};

/* ---------- 指標の選択パネル ---------- */
const ipanel=document.getElementById("ipanel"), ipchips=document.getElementById("ipchips");
let openG=null;
function paintBtns(){
  document.getElementById("cTR").textContent=SEL.tr.size?"（"+SEL.tr.size+"）":"";
  document.getElementById("cOS").textContent=SEL.os.size?"（"+SEL.os.size+"）":"";
  document.getElementById("cSG").textContent=SEL.sg.size?"（"+SEL.sg.size+"）":"";
  document.querySelectorAll(".ib").forEach(b=>b.classList.toggle("on",b.dataset.g===openG));
}
function renderPanel(){
  if(!openG){ ipanel.hidden=true; paintBtns(); return; }
  const defs=openG==="tr"?TRD:openG==="os"?OSC:SGD, set=SEL[openG], P0=PERIODS.find(x=>x.k===cur);
  document.getElementById("iptitle").textContent=openG==="tr"?"トレンド系":openG==="os"?"オシレーター系":"売買サイン";
  document.getElementById("ipdesc").textContent=openG==="tr"?"相場の方向性を読む指標。チャートに重ねて表示します。"
    :openG==="os"?"過熱感や転換点を見る指標。チャートの下に並べて表示します。"
    :"条件を満たした足に「買」「売」の印を付けます。種類ごとにチェックで表示／非表示。機械的な目安です。";
  ipchips.innerHTML=defs.map(d=>'<label class="ic'+(set.has(d.k)?' on':'')+'"><input type="checkbox" data-k="'+d.k+'"'+(set.has(d.k)?' checked':'')+'>'
    +'<span>'+d.name+'</span><small>'+d.prm(P0)+'</small></label>').join("");
  const st=document.getElementById("sgst"); st.hidden=openG!=="sg";
  if(openG==="sg"){ [...document.getElementById("sgstyle").children].forEach(x=>x.classList.toggle("on",x.dataset.st===SGST));
    document.getElementById("sgvl").checked=SGVL; }
  ipanel.hidden=false; paintBtns();
}
document.querySelectorAll(".ib").forEach(b=>b.addEventListener("click",()=>{
  openG=(openG===b.dataset.g)?null:b.dataset.g; renderPanel(); draw(); }));
ipchips.addEventListener("change",e=>{ const k=e.target.dataset.k; if(!k||!openG) return;
  if(e.target.checked) SEL[openG].add(k); else SEL[openG].delete(k);
  e.target.closest(".ic").classList.toggle("on",e.target.checked);
  saveSel(); paintBtns(); draw(); });
document.getElementById("sgstyle").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  SGST=b.dataset.st; saveSel(); renderPanel(); draw(); });
document.getElementById("sgvl").addEventListener("change",e=>{ SGVL=e.target.checked; saveSel(); draw(); });
document.getElementById("ipreset").addEventListener("click",()=>{ if(!openG) return;
  SEL[openG]=new Set(DEF[openG]); if(openG==="sg"){ SGST="label"; SGVL=false; } saveSel(); renderPanel(); draw(); });
document.getElementById("ipnone").addEventListener("click",()=>{ if(!openG) return;
  SEL[openG]=new Set(); saveSel(); renderPanel(); draw(); });
document.getElementById("ipclose").addEventListener("click",()=>{ openG=null; renderPanel(); draw(); });
paintBtns();

const pe=document.getElementById("periods");
pe.innerHTML=PERIODS.map(p=>'<button data-k="'+p.k+'"'+(p.k===cur?' class="on"':'')+'>'+p.label+'</button>').join("");
pe.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  cur=b.dataset.k;[...pe.children].forEach(x=>x.classList.toggle("on",x===b)); if(openG) renderPanel(); draw();});

const xhv=document.getElementById("xhv"), xhh=document.getElementById("xhh");
function vpTip(y){ // カーソルの高さにある価格帯の出来高
  if(!VP||!geo||y<geo.pT||y>geo.pB) return "";
  const p=geo.lo+(geo.pB-y)/(geo.pB-geo.pT)*(geo.hi-geo.lo), k=Math.floor((p-VP.lo)/VP.w);
  if(k<0||k>=VP.nb) return "";
  const a=VP.lo+k*VP.w, v=VP.vol[k];
  return '<br><span>価格帯 '+Math.round(a).toLocaleString("ja-JP")+'〜'+Math.round(a+VP.w).toLocaleString("ja-JP")+'</span> '
    +fmtV(Math.round(v))+'（'+(v/VP.tot*100).toFixed(1)+'%'+(k===VP.poc?'・POC':'')+'）';
}
function hideTip(){ tip.style.display="none"; xhv.style.display="none"; xhh.style.display="none"; }
function showTip(cx,cy){
  if(!geo||!D)return; const r=cv.getBoundingClientRect(), x=cx-r.left, y=cy-r.top;
  const i=Math.max(0,Math.min(geo.n-1,Math.floor((x-geo.L)/geo.cw)));
  const b=view[i]; if(!b){hideTip();return;}
  const u=UNIT[P.agg], bu=UNIT[P.bbAgg], ch=b.c-b.o, T_=D.tr;
  const row=(k,v)=>'<span>'+k+'</span> '+v+'<br>';
  const j3=(arr)=>arr.map(a=>fmt(a[i])).join(' / ');
  let s='<div class="d">'+b.t+(P.agg==="d"?"":"（"+u+"足）")+'</div>'+
    '<span>始</span> '+fmt(b.o)+'　<span>高</span> '+fmt(b.h)+'<br>'+
    '<span>安</span> '+fmt(b.l)+'　<span>終</span> <b style="color:'+(ch>=0?"#D14343":"#2E7D6B")+'">'+fmt(b.c)+'</b><br>'+
    row('出来高',fmtV(b.v));
  if(T_.sma) s+=row('移動平均 '+P.mas.join("/")+u, j3(T_.sma));
  if(T_.ema) s+=row('EMA '+EMAW.join("/")+u, j3(T_.ema));
  if(T_.wma) s+=row('WMA '+WMAW.join("/")+u, j3(T_.wma));
  if(T_.bb){ const B=T_.bb; s+=row('BB('+P.bb+bu+') ±1σ', fmt(B.u1[i])+' / '+fmt(B.l1[i]))+
    row('　　　　±2σ', fmt(B.u2[i])+' / '+fmt(B.l2[i]))+row('　　　　±3σ', fmt(B.u3[i])+' / '+fmt(B.l3[i])); }
  if(T_.ichi){ const I=T_.ichi; s+=row('転換線 / 基準線', fmt(I.tk[i])+' / '+fmt(I.kj[i]))+row('先行1 / 先行2', fmt(I.sa[i])+' / '+fmt(I.sb[i])); }
  if(T_.psar) s+=row('パラボリック', fmt(T_.psar.s[i])+(T_.psar.d[i]==null?'':T_.psar.d[i]?'（上昇）':'（下降）'));
  if(T_.env) s+=row('エンベロープ ±'+T_.env.ps[1]+'%', fmt(T_.env.u[1][i])+' / '+fmt(T_.env.l[1][i]));
  if(T_.hl) s+=row('HLバンド H / L', fmt(T_.hl.H[i])+' / '+fmt(T_.hl.L[i]));
  if(T_.reg) s+=row('回帰トレンド', fmt(T_.reg.fit[i]));
  if(T_.pivot) s+=row('ピボット R1 / P / S1', fmt(T_.pivot.r1[i])+' / '+fmt(T_.pivot.p[i])+' / '+fmt(T_.pivot.s1[i]));
  for(const def of OSC){ if(!onO(def.k)||def.k==="vol") continue; const S=D.os[def.k]; if(!S) continue;
    const ls=(typeof def.lines==="function")?def.lines(P):def.lines;
    s+=row(def.name, ls.map(([k])=>fmtO(S[k][i])).join(' / ')); }
  if(onO("vol")&&D.os.vol) s+=row('出来高 25'+u+'平均', D.os.vol.a[i]==null?'—':fmtV(D.os.vol.a[i]));
  if(D.sg&&D.sg[i]){ const e=D.sg[i];
    if(e.b.length) s+='<b style="color:'+SGBUY+'">▲ 買い</b> '+e.b.map(d=>d.bl(P)).join("、")+'<br>';
    if(e.s.length) s+='<b style="color:'+SGSELL+'">▼ 売り</b> '+e.s.map(d=>d.sl(P)).join("、")+'<br>'; }
  tip.innerHTML=s.replace(/<br>$/,'')+vpTip(y);
  tip.style.display="block";
  const tw=tip.offsetWidth, px=geo.L+geo.cw*(i+0.5);
  tip.style.left=Math.max(0,Math.min(cv.clientWidth-tw,
    px+tw+16<cv.clientWidth?px+14:px-tw-14))+"px";
  tip.style.top=Math.max(0,Math.min(geo.H-tip.offsetHeight,y-10))+"px";
  // 十字線（縦は足の中心、横はカーソル位置）
  xhv.style.display="block"; xhv.style.left=Math.round(px)+"px"; xhv.style.height=geo.bot+"px";
  if(y>=0&&y<=geo.bot){ xhh.style.display="block"; xhh.style.top=Math.round(y)+"px";
    xhh.style.left=geo.L+"px"; xhh.style.width=geo.plotW+"px"; } else xhh.style.display="none";
}
cv.addEventListener("mousemove",e=>showTip(e.clientX,e.clientY));
cv.addEventListener("mouseleave",hideTip);
cv.addEventListener("touchstart",e=>{const t=e.touches[0];showTip(t.clientX,t.clientY);},{passive:true});
cv.addEventListener("touchmove",e=>{const t=e.touches[0];showTip(t.clientX,t.clientY);},{passive:true});
cv.addEventListener("touchend",()=>setTimeout(hideTip,2500),{passive:true});
try{ draw(); }
catch(err){
  document.getElementById("ntbox").open=true;
  document.getElementById("note").textContent="チャートの描画に失敗しました: "+err.message
    +"（ブラウザのバージョンが古い可能性があります。Chrome や最新の Safari でお試しください）";
  console.error(err);
}

  else if(t==="auto"){ document.documentElement.removeAttribute("data-theme"); draw(); }
}); }catch(e){}
