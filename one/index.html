function show(){const q=Q.value.trim().toLowerCase(),m=FM.value,s=FS.value,o=SO.value;

 const mb=$('more');mb.hidden=n<=v.length;mb.textContent=`さらに表示（残り ${(n-v.length).toLocaleString()}件）`;}
