function aggregate(bs, mode){
  if(mode==="d") return bs;
  const out=[]; let cu=null, key=null;
  for(const b of bs){
    let k;
    if(mode==="m"){ k=b.t.slice(0,7); }
    else { const dt=new Date(b.t+"T00:00:00");
           const mo=new Date(dt); mo.setDate(dt.getDate()-((dt.getDay()+6)%7));
           k=mo.toISOString().slice(0,10); }
    if(k!==key){ if(cu)out.push(cu); key=k; cu={t:b.t,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v}; }
    else { cu.h=Math.max(cu.h,b.h); cu.l=Math.min(cu.l,b.l); cu.c=b.c; cu.v+=b.v; cu.t=b.t; }
  }
  if(cu)out.push(cu); return out;
}

function sma(cl,w){const n=cl.length,o=Array(n).fill(null);let s=0;
  for(let i=0;i<n;i++){s+=cl[i]; if(i>=w)s-=cl[i-w]; if(i>=w-1)o[i]=s/w;} return o;}

function withMA(bs, mas){
  const cl=bs.map(b=>b.c), M=mas.map(w=>sma(cl,w));
  return bs.map((b,i)=>({...b,m0:M[0][i],m1:M[1][i],m2:M[2][i]}));
}
function bollinger(bs, W){   // {t,mid,u1..u3,l1..l3} の配列
  const cl=bs.map(b=>b.c), n=cl.length, out=[]; let s=0,s2=0;
  for(let i=0;i<n;i++){ s+=cl[i]; s2+=cl[i]*cl[i];
    if(i>=W){s-=cl[i-W];s2-=cl[i-W]*cl[i-W];}
    if(i>=W-1){const m=s/W,sd=Math.sqrt(Math.max(0,s2/W-m*m));
      out.push({t:bs[i].t,mid:m,u1:m+sd,l1:m-sd,u2:m+2*sd,l2:m-2*sd,u3:m+3*sd,l3:m-3*sd});}}
  return out;
}

function rsiSeries(bs, W){   // Wilder方式の14日RSI
  const out=[]; let ag=0, al=0;
  for(let i=1;i<bs.length;i++){
    const d=bs[i].c-bs[i-1].c, g=Math.max(0,d), l=Math.max(0,-d);
    if(i<=W){ ag+=g/W; al+=l/W; if(i===W) out.push({t:bs[i].t, rsi:al===0?100:100-100/(1+ag/al)}); }
    else { ag=(ag*(W-1)+g)/W; al=(al*(W-1)+l)/W;
           out.push({t:bs[i].t, rsi:al===0?100:100-100/(1+ag/al)}); }}
  return out;
}

function rciSeries(bs, W){   // 日付順位と価格順位のスピアマン順位相関
  const out=[], den=W*W*W-W;
  for(let i=W-1;i<bs.length;i++){
    const win=[]; for(let j=0;j<W;j++) win.push({tr:j+1, c:bs[i-j].c}); // tr=1が直近
    const sorted=[...win].sort((a,b)=>b.c-a.c);
    sorted.forEach((o,k)=>o.pr=k+1);                                    // pr=1が最高値
    let sd=0; for(const o of win){const d=o.tr-o.pr; sd+=d*d;}
    out.push({t:bs[i].t, rci:(1-6*sd/den)*100});}
  return out;
}

function attachBB(rows, bb){ // 各バーに「その日付以前で最新のBB」を割り当てる

}

        showRCI=document.getElementById("tRCI").checked;
  // BB中心線と同じ期間・同じ足の移動平均があれば、線が二重にならないよう1本にまとめる
  const midIdx=(P.agg===P.bbAgg)?P.mas.indexOf(P.bb):-1;
  const drawMid=showBB && !(showMA && midIdx>=0);

  const W=cv.clientWidth, narrow=W<640;
  // 価格チャートを主役にし、サブチャートは固定の高さ＋見出し帯で並べる
  const HD=narrow?15:19, g=narrow?5:8;
  const panes=[];
  if(showVol) panes.push({k:"vol", h:narrow?34:70});
  if(showRSI) panes.push({k:"rsi", h:narrow?46:84});
  if(showRCI) panes.push({k:"rci", h:narrow?54:96});
  const L=narrow?4:8,R=narrow?52:66,T=narrow?6:10,B=narrow?20:24;
  const sub=T+panes.reduce((s,p)=>s+g+HD+p.h,0)+B;
  let mainH;
  if(narrow){
    // 画面の縦幅からチャート上端までを引いた残りに、サブチャートも含めて全部収める
    const top=cv.getBoundingClientRect().top+window.scrollY; _usedTop=top;
    const avail=screenH()-top-6;
    mainH=Math.round(Math.max(190, Math.min(380, avail-sub)));
  } else {
    mainH=Math.round(Math.max(300, Math.min(520, W*0.42)));
  }
  const H=mainH+sub;
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.body), fg=cs.getPropertyValue("--fg").trim(),
        mut=cs.getPropertyValue("--mut").trim(), gl=cs.getPropertyValue("--line").trim(),
        bg=cs.getPropertyValue("--bg").trim();
  const pT=T, pB=T+mainH, plotW=W-L-R, plotH=pB-pT, n=view.length;

  let lo=Infinity,hi=-Infinity;
  for(const b of view){ lo=Math.min(lo,b.l); hi=Math.max(hi,b.h);
    if(n>2&&showBB&&b.l2!=null){lo=Math.min(lo,b.l2);hi=Math.max(hi,b.u2);}
    if(n>2&&showMA)for(const k of["m0","m1","m2"])if(b[k]!=null){lo=Math.min(lo,b[k]);hi=Math.max(hi,b[k]);}}
  if(n>2&&showBB){ // ±3σは広がりすぎることがあるので、延長は基準レンジの15%まで
    const ext=(hi-lo)*0.15; let l3=Infinity,u3=-Infinity;
    for(const b of view){if(b.l3!=null){l3=Math.min(l3,b.l3);u3=Math.max(u3,b.u3);}}
    if(isFinite(l3)){lo=Math.min(lo,Math.max(l3,lo-ext)); hi=Math.max(hi,Math.min(u3,hi+ext));}}
  const pad=(hi-lo)*0.05||hi*0.02||1; lo=Math.max(0,lo-pad); hi+=pad;
  const cw=plotW/n, X=i=>L+cw*(i+0.5), Y=v=>pB-(v-lo)/(hi-lo)*plotH;

  // 横軸の目盛り位置（縦グリッドと日付ラベルで共用）
  const tk=Math.max(1,Math.round(n/(narrow?4:7))), ticks=[];
  for(let i=n-1;i>=0;i-=tk) ticks.push(i);
  const vgrid=(y0,y1)=>{ctx.strokeStyle=gl;ctx.lineWidth=1;ctx.globalAlpha=.6;
    for(const i of ticks){ctx.beginPath();ctx.moveTo(Math.round(X(i))+.5,y0);ctx.lineTo(Math.round(X(i))+.5,y1);ctx.stroke();}
    ctx.globalAlpha=1;};

  const last=view[n-1], lb=bars[bars.length-1],
        pv=bars.length>1?bars[bars.length-2].c:null;
  const upCol="#D14343", dnCol="#2E7D6B", lastUp=pv==null||lb.c>=pv;
  const lastY=Y(last.c);

  ctx.font='11px system-ui,sans-serif'; ctx.textBaseline="middle";
  const rawSt=(hi-lo)/(narrow?5:6), mag=Math.pow(10,Math.floor(Math.log10(rawSt)));
  const st=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=rawSt)||mag*10;
  vgrid(pT,pB);
  for(let v=Math.ceil(lo/st)*st; v<hi; v+=st){
    const y=Math.round(Y(v))+.5; ctx.strokeStyle=gl; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+plotW,y);ctx.stroke();
    if(Math.abs(y-lastY)<13) continue;       // 現在値ラベルと重なる目盛りは省く
    ctx.fillStyle=mut; ctx.textAlign="left";
    ctx.fillText(Math.round(v).toLocaleString("ja-JP"), L+plotW+7, y);}

  ctx.save(); ctx.beginPath(); ctx.rect(L,pT-2,plotW,plotH+4); ctx.clip();
  if(showBB){
    const band=(a,b,al)=>{ctx.beginPath();let s=true;
      for(let i=0;i<n;i++){const v=view[i][a];if(v==null)continue;
        s?(ctx.moveTo(X(i),Y(v)),s=false):ctx.lineTo(X(i),Y(v));}
      for(let i=n-1;i>=0;i--){const v=view[i][b];if(v==null)continue;ctx.lineTo(X(i),Y(v));}
      ctx.closePath();ctx.fillStyle="rgba(74,111,165,"+al+")";ctx.fill();};
    // 塗りは ±2σ の帯だけにして、ローソク足を埋もれさせない
    band("u2","l2",0.08);
    ctx.setLineDash([1.5,3.5]);
    for(const k of ["u3","l3"]) line(view.map(b=>b[k]),X,Y,n,"rgba(74,111,165,.45)",1);
    ctx.setLineDash([4,3]);
    for(const k of ["u2","l2"]) line(view.map(b=>b[k]),X,Y,n,"rgba(74,111,165,.65)",1);
    ctx.setLineDash([1.5,2.5]);
    for(const k of ["u1","l1"]) line(view.map(b=>b[k]),X,Y,n,"rgba(74,111,165,.35)",.9);
    ctx.setLineDash([]);
    if(drawMid) line(view.map(b=>b.mid),X,Y,n,"rgba(74,111,165,.85)",1.2);
  }
  if(showMA) ["m0","m1","m2"].forEach((k,j)=>line(view.map(b=>b[k]),X,Y,n,MACOL[j],j===midIdx&&showBB?1.7:1.5));
  const bw=Math.max(1.5,Math.min(cw*0.68,n<=10?44:26));
  for(let i=0;i<n;i++){const b=view[i], up=b.c>=b.o, col=up?upCol:dnCol;
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.min(1.4,Math.max(.8,cw*0.12));
    ctx.beginPath();ctx.moveTo(X(i),Y(b.h));ctx.lineTo(X(i),Y(b.l));ctx.stroke();
    const y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c));
    ctx.fillRect(X(i)-bw/2,y1,bw,Math.max(1,y2-y1));}
  if(n<=2){ctx.font='12px system-ui,sans-serif';ctx.textAlign="left";
    for(let i=0;i<n;i++){const b=view[i];
      for(const [k,v] of [["始",b.o],["高",b.h],["安",b.l],["終",b.c]]){
        ctx.strokeStyle=gl;ctx.setLineDash([2,3]);ctx.beginPath();
        ctx.moveTo(X(i)+bw/2+3,Y(v));ctx.lineTo(X(i)+bw/2+12,Y(v));ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle=mut;ctx.fillText(k,X(i)+bw/2+18,Y(v));
        ctx.fillStyle=fg;ctx.fillText(fmt(v),X(i)+bw/2+36,Y(v));}}}
  // 現在値の水平線
  ctx.strokeStyle=lastUp?upCol:dnCol; ctx.globalAlpha=.55; ctx.lineWidth=1; ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(L,Math.round(lastY)+.5);ctx.lineTo(L+plotW,Math.round(lastY)+.5);ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  ctx.restore();
  // 現在値のラベル（右軸）
  { const txt=Math.round(last.c).toLocaleString("ja-JP"); ctx.font='600 11px system-ui,sans-serif';
    const tw=ctx.measureText(txt).width+10, ty=Math.max(pT+8,Math.min(pB-8,lastY));
    ctx.fillStyle=lastUp?upCol:dnCol; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(L+plotW+2,ty-8.5,tw,17,3); else ctx.rect(L+plotW+2,ty-8.5,tw,17);
    ctx.fill(); ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.fillText(txt,L+plotW+7,ty+.5); }

  // サブチャート共通：見出し帯（名前と最新値）＋枠線。見出しは線と重ならない位置に書く
  const header=(top,items)=>{ let x=L+2; const y=top+HD/2+1;
    for(const [label,val,col] of items){
      ctx.font='11px system-ui,sans-serif'; ctx.textAlign="left";
      if(col){ctx.fillStyle=col; ctx.fillRect(x,y-1.2,10,2.4); x+=14;}
      ctx.fillStyle=mut; ctx.fillText(label,x,y); x+=ctx.measureText(label).width+4;
      ctx.font='600 11px system-ui,sans-serif'; ctx.fillStyle=col||fg;
      ctx.fillText(val,x,y); x+=ctx.measureText(val).width+14; } };
  const frame=(top,h)=>{ ctx.strokeStyle=gl; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L,top+.5);ctx.lineTo(L+plotW,top+.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(L,top+h-.5);ctx.lineTo(L+plotW,top+h-.5);ctx.stroke(); };

  // 価格チャートとサブチャートの境界線
  ctx.strokeStyle=gl; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(L,pB+.5);ctx.lineTo(L+plotW,pB+.5);ctx.stroke();

  let paneY=pB;
  for(const p of panes){
    const hT=paneY+g, top=hT+HD, bot=top+p.h; paneY=bot;
    if(p.k==="vol"){
      const vmax=Math.max(...view.map(b=>b.v))||1, vh=p.h-2;
      header(hT,[["出来高",fmtV(last.v),null]]);
      vgrid(top,bot); frame(top,p.h);
      for(let i=0;i<n;i++){const b=view[i];
        ctx.fillStyle=(b.c>=b.o?"rgba(209,67,67,.45)":"rgba(46,125,107,.45)");
        const h=Math.max(1,b.v/vmax*vh*0.95); ctx.fillRect(X(i)-bw/2,bot-h,bw,h);}
      ctx.font='10px system-ui,sans-serif';ctx.fillStyle=mut;ctx.textAlign="left";ctx.textBaseline="middle";
      ctx.fillText(fmtV(vmax),L+plotW+7,top+6);
    }
    if(p.k==="rsi"){
      const RY=v=>bot-2-v/100*(p.h-4), lr=last.rsi;
      header(hT,[["RSI("+14+unit+")",lr==null?"—":lr.toFixed(1),RSICOL]]);
      vgrid(top,bot); frame(top,p.h);
      ctx.fillStyle="rgba(209,67,67,.06)"; ctx.fillRect(L,RY(100),plotW,RY(70)-RY(100));   // 買われすぎ
      ctx.fillStyle="rgba(46,125,107,.07)"; ctx.fillRect(L,RY(30),plotW,RY(0)-RY(30));    // 売られすぎ
      ctx.font='10px system-ui,sans-serif';ctx.textBaseline="middle";
      for(const lv of (p.h<70?[70,30]:[70,50,30])){
        const y=Math.round(RY(lv))+.5; ctx.strokeStyle=gl; ctx.lineWidth=1;
        ctx.setLineDash(lv===50?[1,4]:[3,3]); ctx.beginPath();
        ctx.moveTo(L,y);ctx.lineTo(L+plotW,y);ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle=mut;ctx.textAlign="left";ctx.fillText(lv,L+plotW+7,y);}
      ctx.save();ctx.beginPath();ctx.rect(L,top,plotW,p.h);ctx.clip();
      line(view.map(b=>b.rsi),X,RY,n,RSICOL,1.5);
      if(lr!=null){ctx.beginPath();ctx.arc(X(n-1),RY(lr),2.6,0,7);ctx.fillStyle=RSICOL;ctx.fill();}
      ctx.restore();
    }
    if(p.k==="rci"){
      const CY=v=>bot-2-(v+100)/200*(p.h-4), f1=last.rciS, f2=last.rciL;
      header(hT,[["RCI(9"+unit+")",f1==null?"—":f1.toFixed(1),RCICOL.s],
                 ["RCI(26"+unit+")",f2==null?"—":f2.toFixed(1),RCICOL.l]]);
      vgrid(top,bot); frame(top,p.h);
      ctx.fillStyle="rgba(209,67,67,.06)"; ctx.fillRect(L,CY(100),plotW,CY(80)-CY(100));
      ctx.fillStyle="rgba(46,125,107,.07)"; ctx.fillRect(L,CY(-80),plotW,CY(-100)-CY(-80));
      ctx.font='10px system-ui,sans-serif';ctx.textBaseline="middle";
      for(const lv of [80,0,-80]){
        const y=Math.round(CY(lv))+.5; ctx.strokeStyle=gl; ctx.lineWidth=1;
        ctx.setLineDash(lv===0?[1,4]:[3,3]); ctx.beginPath();
        ctx.moveTo(L,y);ctx.lineTo(L+plotW,y);ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle=mut;ctx.textAlign="left";ctx.fillText(lv>0?"+"+lv:lv,L+plotW+7,y);}
      ctx.save();ctx.beginPath();ctx.rect(L,top,plotW,p.h);ctx.clip();
      line(view.map(b=>b.rciL),X,CY,n,RCICOL.l,1.4);
      line(view.map(b=>b.rciS),X,CY,n,RCICOL.s,1.4);
      for(const [k,c] of [["rciL",RCICOL.l],["rciS",RCICOL.s]]){const v=last[k];
        if(v!=null){ctx.beginPath();ctx.arc(X(n-1),CY(v),2.6,0,7);ctx.fillStyle=c;ctx.fill();}}
      ctx.restore();
    }
  }
  geo={L,cw,n,H,pT,plotW,bot:paneY};

  ctx.font='11px system-ui,sans-serif';ctx.fillStyle=mut;ctx.textAlign="center";ctx.textBaseline="middle";
  let prevL=Infinity;   // 右から順に置き、前のラベルと重なるものは省く
  for(const i of ticks){const d=view[i].t;
    const s=P.agg==="m"?d.slice(0,7).replace("-","/"):d.slice(2).replace(/-/g,"/");
    const hw=ctx.measureText(s).width/2;
    const x=Math.min(L+plotW-hw, Math.max(L+hw, X(i)));
    if(x+hw+10>prevL) continue;
    ctx.fillText(s,x,H-B/2+1); prevL=x-hw;}

  document.getElementById("last").textContent=fmt(lb.c);
  const ch=pv!=null?lb.c-pv:0;
  const ce=document.getElementById("chg");
  ce.textContent=(ch>=0?"+":"")+fmt(ch)+" ("+(ch>=0?"+":"")+(pv?ch/pv*100:0).toFixed(2)+"%)";
  ce.className="chg "+(ch>=0?"up":"dn");
  document.getElementById("asof").textContent=narrow?lb.t.slice(5).replace("-","/")+" 時点・"+unit+"足":lb.t+" 時点 ／ "+unit+"足 "+n+"本表示";

  // 凡例は価格チャートの線だけ。RSI・RCI・出来高の値は各サブチャートの見出しに、σの値はツールチップに
  const lg=[];
  if(showMA)P.mas.forEach((w,j)=>lg.push('<span><i style="background:'+MACOL[j]+'"></i>'+w+unit+'線'
     +(j===midIdx&&showBB&&!narrow?'<span style="font-size:.9em">(BB中心)</span>':'')+' <b>'+fmt(last["m"+j])+'</b></span>'));
  if(showBB){
    if(drawMid) lg.push('<span><i style="background:#4A6FA5"></i>'+(narrow?'BB中心':'BB中心('+P.bb+bu+')')+' <b>'+fmt(last.mid)+'</b></span>');
    lg.push('<span><i class="bb"></i>'+(narrow?'BB'+(drawMid?'':'('+P.bb+bu+')'):'BB ±1〜3σ'+(drawMid?'':'('+P.bb+bu+')'))+'</span>');
  }
  document.getElementById("legend").innerHTML=lg.join("");
  // 凡例の行数が変わってチャートの上端がずれたら、もう一度だけ高さを合わせ直す
  if(narrow && !_again){ const nt=cv.getBoundingClientRect().top+window.scrollY;
    if(_usedTop!=null && Math.abs(nt-_usedTop)>1){ _again=true; try{ draw(); } finally{ _again=false; } } }

  const totMA=AGG[P.agg].length, totBB=AGG[P.bbAgg].length;
  const lack=P.mas.filter(w=>Math.max(0,totMA-w+1)<12);
  const bbNote="BB"+P.bb+bu+" ±1〜3σ"+(P.bbAgg!==P.agg?"（週足で計算し"+unit+"足に重ねて表示）":"");
  const rsiNote=" RSI(14"+unit+"、Wilder方式)とRCI(9"+unit+"・26"+unit
    +"、順位相関)も表示中の"+unit+"足ベースで計算しています。";
  document.getElementById("note").textContent=
    "元データは日足です。"+
    (P.agg==="d"?"日足のまま表示し、指標は全期間の日足（移動平均 "+P.mas.join("・")+"日、"+bbNote+"）で計算しています。"
     :(unit+"足に集約し、移動平均は"+unit+"足ベース（"+P.mas.join(unit+"・")+unit+"）、"+bbNote+"。"))+
    (midIdx>=0?" "+P.bb+unit+"移動平均とBB中心線は同じ値のため1本で表示しています。":"")+
    (lack.length?" ※保有データは"+totMA+unit+"ぶんのため、"+lack.join("・")+unit
      +"線は右端の"+lack.map(w=>Math.max(0,totMA-w+1)).join("・")+"点しか描けません"
      +"（フルに引くにはより長期のデータ取得が必要）。":"")+rsiNote+DATANOTE;
  if(DATANOTE) document.getElementById("ntbox").open=true;
}

const pe=document.getElementById("periods");
pe.innerHTML=PERIODS.map(p=>'<button data-k="'+p.k+'"'+(p.k===cur?' class="on"':'')+'>'+p.label+'</button>').join("");
pe.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  cur=b.dataset.k;[...pe.children].forEach(x=>x.classList.toggle("on",x===b));draw();});
for(const id of ["tBB","tMA","tVol","tRSI","tRCI"])document.getElementById(id).addEventListener("change",draw);

const xhv=document.getElementById("xhv"), xhh=document.getElementById("xhh");
function hideTip(){ tip.style.display="none"; xhv.style.display="none"; xhh.style.display="none"; }
function showTip(cx,cy){
  if(!geo)return; const r=cv.getBoundingClientRect(), x=cx-r.left, y=cy-r.top;
  const i=Math.max(0,Math.min(geo.n-1,Math.floor((x-geo.L)/geo.cw)));
  const b=view[i]; if(!b){hideTip();return;}
  const u=UNIT[P.agg], bu=UNIT[P.bbAgg], ch=b.c-b.o;
  const row=(k,v)=>'<span>'+k+'</span> '+v+'<br>';
  tip.innerHTML='<div class="d">'+b.t+(P.agg==="d"?"":"（"+u+"足）")+'</div>'+
    '<span>始</span> '+fmt(b.o)+'　<span>高</span> '+fmt(b.h)+'<br>'+
    '<span>安</span> '+fmt(b.l)+'　<span>終</span> <b style="color:'+(ch>=0?"#D14343":"#2E7D6B")+'">'+fmt(b.c)+'</b><br>'+
    row('出来高',fmtV(b.v))+
    row('移動平均 '+P.mas.join("/")+u, fmt(b.m0)+' / '+fmt(b.m1)+' / '+fmt(b.m2))+
    row('BB('+P.bb+bu+') ±1σ', fmt(b.u1)+' / '+fmt(b.l1))+
    row('　　　　±2σ', fmt(b.u2)+' / '+fmt(b.l2))+
    row('　　　　±3σ', fmt(b.u3)+' / '+fmt(b.l3))+
    row('RSI(14'+u+')', b.rsi==null?"—":b.rsi.toFixed(1))+
    '<span>RCI(9/26'+u+')</span> '+(b.rciS==null?"—":b.rciS.toFixed(1))
      +' / '+(b.rciL==null?"—":b.rciL.toFixed(1));
  tip.style.display="block";
  const tw=tip.offsetWidth, px=geo.L+geo.cw*(i+0.5);
  tip.style.left=Math.max(0,Math.min(cv.clientWidth-tw,
    px+tw+16<cv.clientWidth?px+14:px-tw-14))+"px";
  tip.style.top=Math.max(0,Math.min(geo.H-tip.offsetHeight,y-10))+"px";
  // 十字線（縦は足の中心、横はカーソル位置）
  xhv.style.display="block"; xhv.style.left=Math.round(px)+"px"; xhv.style.height=geo.bot+"px";
  if(y>=0&&y<=geo.bot){ xhh.style.display="block"; xhh.style.top=Math.round(y)+"px";
    xhh.style.left=geo.L+"px"; xhh.style.width=geo.plotW+"px"; } else xhh.style.display="none";
}
cv.addEventListener("mousemove",e=>showTip(e.clientX,e.clientY));
cv.addEventListener("mouseleave",hideTip);
cv.addEventListener("touchstart",e=>{const t=e.touches[0];showTip(t.clientX,t.clientY);},{passive:true});
cv.addEventListener("touchmove",e=>{const t=e.touches[0];showTip(t.clientX,t.clientY);},{passive:true});
cv.addEventListener("touchend",()=>setTimeout(hideTip,2500),{passive:true});
try{ draw(); }
catch(err){
  document.getElementById("ntbox").open=true;
  document.getElementById("note").textContent="チャートの描画に失敗しました: "+err.message
    +"（ブラウザのバージョンが古い可能性があります。Chrome や最新の Safari でお試しください）";
  console.error(err);
}
try{ addEventListener("resize",draw); }catch(e){}
try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw); }
catch(e){ try{ matchMedia("(prefers-color-scheme:dark)").addListener(draw); }catch(e2){} }
/* 親ページの表示切替に追従する（埋め込み表示のとき） */
try{ addEventListener("message",function(ev){
  var t=ev&&ev.data&&ev.data.chartTheme;
  if(t==="dark"||t==="light"){ document.documentElement.setAttribute("data-theme",t); draw(); }
  else if(t==="auto"){ document.documentElement.removeAttribute("data-theme"); draw(); }
}); }catch(e){}
</script></body></html>
