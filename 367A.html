}
const RSIS = {d:rsiSeries(AGG.d,14), w:rsiSeries(AGG.w,14), m:rsiSeries(AGG.m,14)};
const RCICOL={s:"#C0567E", l:"#4E5D94"};
function rciSeries(bs, W){   // 日付順位と価格順位のスピアマン順位相関
  const out=[], den=W*W*W-W;
  for(let i=W-1;i<bs.length;i++){
    const win=[]; for(let j=0;j<W;j++) win.push({tr:j+1, c:bs[i-j].c}); // tr=1が直近
    const sorted=[...win].sort((a,b)=>b.c-a.c);
    sorted.forEach((o,k)=>o.pr=k+1);                                    // pr=1が最高値
    let sd=0; for(const o of win){const d=o.tr-o.pr; sd+=d*d;}
    out.push({t:bs[i].t, rci:(1-6*sd/den)*100});}
  return out;
}
const RCIS={}; for(const k of ["d","w","m"])
  RCIS[k]={s:rciSeries(AGG[k],9), l:rciSeries(AGG[k],26)};
const NOBB={mid:null,u1:null,l1:null,u2:null,l2:null,u3:null,l3:null};
function attachBB(rows, bb){ // 各バーに「その日付以前で最新のBB」を割り当てる
  let j=-1; return rows.map(r=>{
    while(j+1<bb.length && bb[j+1].t<=r.t) j++;
    const s=(j>=0 && bb[j].t<=r.t)?bb[j]:NOBB;
    return {...r, mid:s.mid,u1:s.u1,l1:s.l1,u2:s.u2,l2:s.l2,u3:s.u3,l3:s.l3};});
}
function attachRSI(rows, ser){
  let j=-1; return rows.map(r=>{
    while(j+1<ser.length && ser[j+1].t<=r.t) j++;
    return {...r, rsi:(j>=0 && ser[j].t<=r.t)?ser[j].rsi:null};});
}
function attachRCI(rows, ss, ls){
  let a=-1,b=-1; return rows.map(r=>{
    while(a+1<ss.length && ss[a+1].t<=r.t) a++;
    while(b+1<ls.length && ls[b+1].t<=r.t) b++;
    return {...r, rciS:(a>=0&&ss[a].t<=r.t)?ss[a].rci:null,
                  rciL:(b>=0&&ls[b].t<=r.t)?ls[b].rci:null};});
}

const fmt=v=>v==null?"—":v.toLocaleString("ja-JP",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtV=v=>v>=1e8?(v/1e8).toFixed(2)+"億":v>=1e4?(v/1e4).toFixed(1)+"万":String(v);
const cv=document.getElementById("cv"), ctx=cv.getContext("2d"), tip=document.getElementById("tip");
let view=[], geo=null, P=null;

function line(vals,X,Y,n,color,w){
  let pts=0, started=false; ctx.beginPath();
  for(let i=0;i<n;i++){const v=vals[i]; if(v==null)continue; pts++;
    started?ctx.lineTo(X(i),Y(v)):(ctx.moveTo(X(i),Y(v)),started=true);}
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke();
  if(pts===1){for(let i=0;i<n;i++){const v=vals[i]; if(v==null)continue;
    ctx.beginPath();ctx.arc(X(i),Y(v),2.6,0,7);ctx.fillStyle=color;ctx.fill();}}
}

function draw(){
  P=PERIODS.find(x=>x.k===cur);
  const unit=UNIT[P.agg], bu=UNIT[P.bbAgg];
  const full=attachRCI(
      attachRSI(attachBB(withMA(AGG[P.agg],P.mas), bollinger(AGG[P.bbAgg],P.bb)), RSIS[P.agg]),
      RCIS[P.agg].s, RCIS[P.agg].l);
  view=full.slice(Math.max(0,full.length-P.n));
  const showVol=document.getElementById("tVol").checked,
        showBB=document.getElementById("tBB").checked,
        showMA=document.getElementById("tMA").checked,
        showRSI=document.getElementById("tRSI").checked,
        showRCI=document.getElementById("tRCI").checked;

  const W=cv.clientWidth, narrow=W<640;
  const base=narrow?Math.round(W*1.05):Math.round(W*0.52);
  const H=Math.max(narrow?380:440, Math.min(narrow?760:880,
          base+(showRSI?(narrow?70:88):0)+(showRCI?(narrow?70:88):0)));
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.body), fg=cs.getPropertyValue("--fg").trim(),
        mut=cs.getPropertyValue("--mut").trim(), gl=cs.getPropertyValue("--line").trim();
  const L=8,R=66,T=10,B=26,g=12;
  const volH=showVol?Math.round(H*0.15):0, rsiH=showRSI?Math.round(H*0.16):0,
        rciH=showRCI?Math.round(H*0.16):0;
  const pT=T, pB=H-B-(volH?volH+g:0)-(rsiH?rsiH+g:0)-(rciH?rciH+g:0),
        plotW=W-L-R, plotH=pB-pT, n=view.length;

  let lo=Infinity,hi=-Infinity;
  for(const b of view){ lo=Math.min(lo,b.l); hi=Math.max(hi,b.h);
    if(n>2&&showBB&&b.l2!=null){lo=Math.min(lo,b.l2);hi=Math.max(hi,b.u2);}
    if(n>2&&showMA)for(const k of["m0","m1","m2"])if(b[k]!=null){lo=Math.min(lo,b[k]);hi=Math.max(hi,b[k]);}}
  if(n>2&&showBB){ // ±3σは広がりすぎることがあるので、延長は基準レンジの30%まで
    const ext=(hi-lo)*0.3; let l3=Infinity,u3=-Infinity;
    for(const b of view){if(b.l3!=null){l3=Math.min(l3,b.l3);u3=Math.max(u3,b.u3);}}
    if(isFinite(l3)){lo=Math.min(lo,Math.max(l3,lo-ext)); hi=Math.max(hi,Math.min(u3,hi+ext));}}
  const pad=(hi-lo)*0.08||hi*0.02||1; lo=Math.max(0,lo-pad); hi+=pad;
  const cw=plotW/n, X=i=>L+cw*(i+0.5), Y=v=>pB-(v-lo)/(hi-lo)*plotH;
  geo={L,cw,n,H};

  ctx.font='11px system-ui,sans-serif'; ctx.textBaseline="middle";
  const rawSt=(hi-lo)/6, mag=Math.pow(10,Math.floor(Math.log10(rawSt)));
  const st=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=rawSt)||mag*10;
  for(let v=Math.ceil(lo/st)*st; v<hi; v+=st){
    const y=Y(v); ctx.strokeStyle=gl; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+plotW,y);ctx.stroke();
    ctx.fillStyle=mut; ctx.textAlign="left";
    ctx.fillText(Math.round(v).toLocaleString("ja-JP"), L+plotW+8, y);}

  ctx.save(); ctx.beginPath(); ctx.rect(L,pT-2,plotW,plotH+4); ctx.clip();
  if(showBB){
    const band=(a,b,al)=>{ctx.beginPath();let s=true;
      for(let i=0;i<n;i++){const v=view[i][a];if(v==null)continue;
        s?(ctx.moveTo(X(i),Y(v)),s=false):ctx.lineTo(X(i),Y(v));}
      for(let i=n-1;i>=0;i--){const v=view[i][b];if(v==null)continue;ctx.lineTo(X(i),Y(v));}
      ctx.closePath();ctx.fillStyle="rgba(74,111,165,"+al+")";ctx.fill();};
    band("u3","l3",0.06); band("u2","l2",0.10); band("u1","l1",0.16);
    ctx.setLineDash([2,3]);
    for(const k of ["u3","l3"]) line(view.map(b=>b[k]),X,Y,n,"rgba(74,111,165,.5)",1);
    ctx.setLineDash([4,3]);
    for(const k of ["u2","l2"]) line(view.map(b=>b[k]),X,Y,n,"rgba(74,111,165,.7)",1);
    ctx.setLineDash([]);
    for(const k of ["u1","l1"]) line(view.map(b=>b[k]),X,Y,n,"rgba(74,111,165,.4)",.9);
    line(view.map(b=>b.mid),X,Y,n,"rgba(74,111,165,.9)",1.2);
  }
  const bw=Math.max(1.5,Math.min(cw*0.66,n<=10?44:26));
  for(let i=0;i<n;i++){const b=view[i], up=b.c>=b.o, col=up?"#D14343":"#2E7D6B";
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.min(1.4,Math.max(.8,cw*0.12));
    ctx.beginPath();ctx.moveTo(X(i),Y(b.h));ctx.lineTo(X(i),Y(b.l));ctx.stroke();
    const y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c));
    ctx.fillRect(X(i)-bw/2,y1,bw,Math.max(1,y2-y1));}
  if(n<=2){ctx.font='12px system-ui,sans-serif';ctx.textAlign="left";
    for(let i=0;i<n;i++){const b=view[i];
      for(const [k,v] of [["始",b.o],["高",b.h],["安",b.l],["終",b.c]]){
        ctx.strokeStyle=gl;ctx.setLineDash([2,3]);ctx.beginPath();
        ctx.moveTo(X(i)+bw/2+3,Y(v));ctx.lineTo(X(i)+bw/2+12,Y(v));ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle=mut;ctx.fillText(k,X(i)+bw/2+18,Y(v));
        ctx.fillStyle=fg;ctx.fillText(fmt(v),X(i)+bw/2+36,Y(v));}}}
  if(showMA) ["m0","m1","m2"].forEach((k,j)=>line(view.map(b=>b[k]),X,Y,n,MACOL[j],1.4));
  ctx.restore();

  let paneY=pB;
  if(showVol){
    const vT=paneY+g, vB=vT+volH, vh=vB-vT, vmax=Math.max(...view.map(b=>b.v))||1; paneY=vB;
    ctx.strokeStyle=gl;ctx.beginPath();ctx.moveTo(L,vB);ctx.lineTo(L+plotW,vB);ctx.stroke();
    for(let i=0;i<n;i++){const b=view[i];
      ctx.fillStyle=(b.c>=b.o?"rgba(209,67,67,.5)":"rgba(46,125,107,.5)");
      const h=Math.max(1,b.v/vmax*vh*0.92); ctx.fillRect(X(i)-bw/2,vB-h,bw,h);}
    ctx.font='11px system-ui,sans-serif';ctx.fillStyle=mut;ctx.textAlign="left";
    ctx.fillText(fmtV(vmax),L+plotW+8,vT+6);}

  if(showRSI){
    const rT=paneY+g, rB=rT+rsiH, RY=v=>rB-v/100*rsiH; paneY=rB;
    ctx.fillStyle="rgba(31,122,140,.07)";
    ctx.fillRect(L,RY(70),plotW,RY(30)-RY(70));           // 30〜70の中立ゾーン
    ctx.font='10px system-ui,sans-serif';ctx.textBaseline="middle";
    for(const lv of [70,50,30]){
      const y=RY(lv); ctx.strokeStyle=gl; ctx.lineWidth=1;
      ctx.setLineDash(lv===50?[1,4]:[3,3]); ctx.beginPath();
      ctx.moveTo(L,y);ctx.lineTo(L+plotW,y);ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=mut;ctx.textAlign="left";ctx.fillText(lv,L+plotW+8,y);}
    ctx.save();ctx.beginPath();ctx.rect(L,rT-1,plotW,rsiH+2);ctx.clip();
    line(view.map(b=>b.rsi),X,RY,n,RSICOL,1.4);
    const lr=view[n-1].rsi;
    if(lr!=null){ctx.beginPath();ctx.arc(X(n-1),RY(lr),2.6,0,7);ctx.fillStyle=RSICOL;ctx.fill();}
    ctx.restore();
    ctx.fillStyle=RSICOL;ctx.textAlign="left";ctx.font='11px system-ui,sans-serif';
    ctx.fillText("RSI(14"+unit+") "+(view[n-1].rsi==null?"—":view[n-1].rsi.toFixed(1)),L+4,rT+8);}

  if(showRCI){
    const cT=paneY+g, cB=cT+rciH, CY=v=>cB-(v+100)/200*rciH; paneY=cB;
    ctx.fillStyle="rgba(120,120,140,.05)";ctx.fillRect(L,CY(80),plotW,CY(-80)-CY(80));
    ctx.font='10px system-ui,sans-serif';ctx.textBaseline="middle";
    for(const lv of [80,0,-80]){
      const y=CY(lv); ctx.strokeStyle=gl; ctx.lineWidth=1;
      ctx.setLineDash(lv===0?[1,4]:[3,3]); ctx.beginPath();
      ctx.moveTo(L,y);ctx.lineTo(L+plotW,y);ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=mut;ctx.textAlign="left";ctx.fillText(lv>0?"+"+lv:lv,L+plotW+8,y);}
    ctx.save();ctx.beginPath();ctx.rect(L,cT-1,plotW,rciH+2);ctx.clip();
    line(view.map(b=>b.rciL),X,CY,n,RCICOL.l,1.3);
    line(view.map(b=>b.rciS),X,CY,n,RCICOL.s,1.3);
    for(const [k,c] of [["rciL",RCICOL.l],["rciS",RCICOL.s]]){const v=view[n-1][k];
      if(v!=null){ctx.beginPath();ctx.arc(X(n-1),CY(v),2.6,0,7);ctx.fillStyle=c;ctx.fill();}}
    ctx.restore();
    ctx.font='11px system-ui,sans-serif';ctx.textAlign="left";
    const f1=view[n-1].rciS, f2=view[n-1].rciL;
    ctx.fillStyle=RCICOL.s;ctx.fillText("RCI(9) "+(f1==null?"—":f1.toFixed(1)),L+4,cT+8);
    ctx.fillStyle=RCICOL.l;ctx.fillText("RCI(26) "+(f2==null?"—":f2.toFixed(1)),
      narrow?L+4:L+96, narrow?cT+22:cT+8);}

  ctx.font='11px system-ui,sans-serif';ctx.fillStyle=mut;ctx.textAlign="center";
  const tk=Math.max(1,Math.round(n/(narrow?4:7)));
  for(let i=n-1;i>=0;i-=tk){const d=view[i].t;
    ctx.fillText(P.agg==="m"?d.slice(0,7):d.slice(2).replace(/-/g,"/"),X(i),H-B/2+2);}

  const last=view[n-1], lb=bars[bars.length-1],
        pv=bars.length>1?bars[bars.length-2].c:null;
  document.getElementById("last").textContent=fmt(lb.c);
  const ch=pv!=null?lb.c-pv:0;
  const ce=document.getElementById("chg");
  ce.textContent=(ch>=0?"+":"")+fmt(ch)+" ("+(ch>=0?"+":"")+(pv?ch/pv*100:0).toFixed(2)+"%)";
  ce.className="chg "+(ch>=0?"up":"dn");
  document.getElementById("asof").textContent=lb.t+" 時点 ／ "+unit+"足 "+n+"本表示";

  const lg=[];
  if(showMA)P.mas.forEach((w,j)=>lg.push([MACOL[j],w+unit+"移動平均",last["m"+j]]));
  document.getElementById("legend").innerHTML=lg.map(([c,t,v])=>
    '<span><i style="background:'+c+'"></i>'+t+" "+fmt(v)+"</span>").join("")
    +(showBB?'<span><i style="background:#4A6FA5"></i>BB中心線('+P.bb+bu+') '+fmt(last.mid)+"</span>"
      +[[1,last.u1,last.l1],[2,last.u2,last.l2],[3,last.u3,last.l3]].map(([k,u,l])=>
        "<span class='sg'>±"+k+"σ "+fmt(u)+" / "+fmt(l)+"</span>").join(""):"")
    +(showRSI?'<span><i style="background:'+RSICOL+'"></i>RSI(14'+unit+') '
      +(last.rsi==null?"—":last.rsi.toFixed(1))+"</span>":"")
    +(showRCI?'<span><i style="background:'+RCICOL.s+'"></i>RCI(9'+unit+') '
      +(last.rciS==null?"—":last.rciS.toFixed(1))+"</span>"
      +'<span><i style="background:'+RCICOL.l+'"></i>RCI(26'+unit+') '
      +(last.rciL==null?"—":last.rciL.toFixed(1))+"</span>":"");

  const totMA=AGG[P.agg].length, totBB=AGG[P.bbAgg].length;
  const lack=P.mas.filter(w=>Math.max(0,totMA-w+1)<12);
  const bbNote="BB"+P.bb+bu+" ±1〜3σ"+(P.bbAgg!==P.agg?"（週足で計算し"+unit+"足に重ねて表示）":"");
  const rsiNote=" RSI(14"+unit+"、Wilder方式)とRCI(9"+unit+"・26"+unit
    +"、順位相関)も表示中の"+unit+"足ベースで計算しています。";
  document.getElementById("note").textContent=
    "元データは日足です。"+
    (P.agg==="d"?"日足のまま表示し、指標は全期間の日足（移動平均 "+P.mas.join("・")+"日、"+bbNote+"）で計算しています。"
     :(unit+"足に集約し、移動平均は"+unit+"足ベース（"+P.mas.join(unit+"・")+unit+"）、"+bbNote+"。"))+
    (lack.length?" ※保有データは"+totMA+unit+"ぶんのため、"+lack.join("・")+unit
      +"線は右端の"+lack.map(w=>Math.max(0,totMA-w+1)).join("・")+"点しか描けません"
      +"（フルに引くにはより長期のデータ取得が必要）。":"")+rsiNote+DATANOTE;
}

const pe=document.getElementById("periods");
pe.innerHTML=PERIODS.map(p=>'<button data-k="'+p.k+'"'+(p.k===cur?' class="on"':'')+'>'+p.label+'</button>').join("");
pe.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  cur=b.dataset.k;[...pe.children].forEach(x=>x.classList.toggle("on",x===b));draw();});
for(const id of ["tBB","tMA","tVol","tRSI","tRCI"])document.getElementById(id).addEventListener("change",draw);

function showTip(cx,cy){
  if(!geo)return; const r=cv.getBoundingClientRect(), x=cx-r.left;
  const i=Math.max(0,Math.min(geo.n-1,Math.floor((x-geo.L)/geo.cw)));
  const b=view[i]; if(!b){tip.style.display="none";return;}
  const u=UNIT[P.agg], bu=UNIT[P.bbAgg];
  tip.innerHTML='<div class="d">'+b.t+(P.agg==="d"?"":"（"+u+"足）")+'</div>'+
    '<span>始</span> '+fmt(b.o)+' <span>高</span> '+fmt(b.h)+'<br>'+
    '<span>安</span> '+fmt(b.l)+' <span>終</span> '+fmt(b.c)+'<br>'+
    '<span>出来高</span> '+fmtV(b.v)+'<br>'+
    '<span>SMA '+P.mas.join("/")+u+'</span> '+fmt(b.m0)+' / '+fmt(b.m1)+' / '+fmt(b.m2)+'<br>'+
    '<span>BB('+P.bb+bu+') 中心</span> '+fmt(b.mid)+'<br>'+
    '<span>±1σ</span> '+fmt(b.u1)+' / '+fmt(b.l1)+'<br>'+
    '<span>±2σ</span> '+fmt(b.u2)+' / '+fmt(b.l2)+'<br>'+
    '<span>±3σ</span> '+fmt(b.u3)+' / '+fmt(b.l3)+'<br>'+
    '<span>RSI(14'+u+')</span> '+(b.rsi==null?"—":b.rsi.toFixed(1))+'<br>'+
    '<span>RCI(9/26'+u+')</span> '+(b.rciS==null?"—":b.rciS.toFixed(1))
      +' / '+(b.rciL==null?"—":b.rciL.toFixed(1));
  tip.style.display="block";
  const tw=tip.offsetWidth, px=geo.L+geo.cw*(i+0.5);
  tip.style.left=Math.max(0,Math.min(cv.clientWidth-tw,
    px+tw+16<cv.clientWidth?px+14:px-tw-14))+"px";
  tip.style.top=Math.max(0,Math.min(geo.H-tip.offsetHeight,cy-r.top-10))+"px";
}
cv.addEventListener("mousemove",e=>showTip(e.clientX,e.clientY));
cv.addEventListener("mouseleave",()=>tip.style.display="none");
cv.addEventListener("touchstart",e=>{const t=e.touches[0];showTip(t.clientX,t.clientY);},{passive:true});
cv.addEventListener("touchmove",e=>{const t=e.touches[0];showTip(t.clientX,t.clientY);},{passive:true});
cv.addEventListener("touchend",()=>setTimeout(()=>tip.style.display="none",2500),{passive:true});
try{ draw(); }
catch(err){
  document.getElementById("note").textContent="チャートの描画に失敗しました: "+err.message
    +"（ブラウザのバージョンが古い可能性があります。Chrome や最新の Safari でお試しください）";
  console.error(err);
}
try{ addEventListener("resize",draw); }catch(e){}
try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw); }
catch(e){ try{ matchMedia("(prefers-color-scheme:dark)").addListener(draw); }catch(e2){} }
/* 親ページの表示切替に追従する（埋め込み表示のとき） */
try{ addEventListener("message",function(ev){
  var t=ev&&ev.data&&ev.data.chartTheme;
  if(t==="dark"||t==="light"){ document.documentElement.setAttribute("data-theme",t); draw(); }
  else if(t==="auto"){ document.documentElement.removeAttribute("data-theme"); draw(); }
}); }catch(e){}
</script></body></html>
